# Vega package manifest for "Across the Room: the far-side check" (TV display).
#
# STATUS: written from the public Vega manifest documentation and the structure described in
# docs/adr/0007-runtime-and-toolchain.md. NATIVE VALIDATION IS PENDING (blocker B-001: the Vega SDK
# cannot be installed on the build host). Nothing here has been checked by `vega project doctor`,
# `vpt validate` or on a Vega Virtual Device. Treat every entry as unverified until those run.
#
# Privacy contract for this manifest: the TV never captures audio. There is deliberately NO
# microphone, media, audio-capture, DRM or input-method entry. The microphone lives on the phone.

schema-version = 1

[package]
# Package id; the interactive component id below must start with it.
id = "com.acrosstheroom.farsidecheck"
title = "Across the Room"
version = "0.1.0"
# Resolved from assets/image/. Placeholder artwork generated by scripts/generate-icon.mjs
# (original, programmatic); replace with final store artwork before submission.
icon = "@image/farsidecheck-icon.png"

[os.version]
# SDK 0.24 requires an [os.version] section; RN 0.83 needs OS 1.2 at minimum (ADR-0007).
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
# Must equal "name" in app.json. The Appstore requires an interactive component with the main
# category, otherwise the app is not launchable from the launcher.
id = "com.acrosstheroom.farsidecheck.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
categories = ["com.amazon.category.main"]
# One instance only: a second launch must resume the running session, never start another.
launch-type = "singleton"

[wants]
# Remote control (D-pad, OK, Back) delivery.
[[wants.service]]
id = "com.amazon.inputd.service"

# Network access for the WSS connection to the relay (ADR-0006). Whether further network
# privileges are required for WebSocket is an open native check (research/_working/
# across_room_platform_research.md, "Open gates" item 3); the official TV sample additionally
# declares com.amazon.network.privilege.net-info under [needs], which we do not use because we do
# not read network information. Re-check with `vega project doctor` once the SDK is available.
[[wants.service]]
id = "com.amazon.network.service"

# Read-only access to accessibility settings (UI scale, screen reader state).
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[needs]
# Platform API level the app is built against.
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"
